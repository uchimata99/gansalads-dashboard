<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>נוכחות עובדים</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>document.documentElement.classList.add('locked')</script>
  <style>
    html.locked{overflow:hidden}
    html.locked body>*{display:none!important}
    html.locked #gsLock{display:flex!important}
    #gsLock{display:none;position:fixed;inset:0;z-index:99999;background:#173f30;flex-direction:column;
            align-items:center;justify-content:center;gap:18px;font-family:'Segoe UI',Arial,sans-serif;direction:rtl}
    #gsLock .lock-logo{font-size:38px}
    #gsLock .lock-title{color:#a7d7c2;font-size:19px;font-weight:800}
    #gsLock .lock-sub{color:#cfe8db;font-size:13px;max-width:320px;text-align:center;line-height:1.7}
    #gsLock .gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#3c4043;border:none;
            border-radius:10px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
    #gsLock .gbtn:hover{background:#f1f5f9}
    #gsLock .gbtn svg{width:18px;height:18px}
    #gsLock .lock-err{color:#ffb4a8;font-size:13px;min-height:18px}

    :root { --green:#15803d; --green6:#16a34a; --stone50:#fafaf9; --stone100:#f5f5f4;
            --stone200:#e7e5e4; --stone500:#78716c; --stone800:#292524; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--stone50); color:var(--stone800);
           font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
    .wrap { max-width:900px; margin:0 auto; padding:24px 20px 48px; }
    .head { display:flex; align-items:center; gap:12px; margin-bottom:4px; }
    .bar { width:8px; height:32px; background:var(--green); border-radius:3px; }
    h1 { font-size:24px; margin:0; }
    .sub { color:var(--stone500); font-size:14px; margin:4px 0 20px 20px; }
    .card { background:#fff; border:1px solid var(--stone200); border-radius:16px; padding:16px; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    button { font-family:inherit; cursor:pointer; border:none; border-radius:10px;
             padding:8px 14px; font-size:14px; font-weight:600; }
    .btn-green { background:var(--green); color:#fff; }
    .btn-soft { background:var(--stone100); color:var(--stone800); }
    .btn-del { background:#dc2626; color:#fff; }
    .delchk { width:20px; height:20px; accent-color:var(--green); cursor:pointer; }
    .emp-del .name { cursor:pointer; }
    #delBar { display:none; position:sticky; bottom:0; z-index:50; gap:10px;
              justify-content:center; align-items:center; padding:12px;
              background:#fff; border-top:1px solid var(--stone200); box-shadow:0 -6px 18px rgba(0,0,0,.06); }
    input[type=date],select { font-family:inherit; border:1px solid var(--stone200);
             border-radius:8px; padding:6px 10px; font-size:14px; background:var(--stone50); }
    .search { width:100%; margin-top:12px; border:1px solid var(--stone200); border-radius:10px;
              padding:10px 12px; font-size:15px; font-family:inherit; background:var(--stone50); }
    .hero { background:var(--green); color:#fff; border-radius:16px; padding:20px; margin:16px 0; }
    .hero .n { font-size:38px; font-weight:700; line-height:1; margin-top:4px; }
    .hero .n small { font-size:18px; font-weight:500; opacity:.85; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .chip { background:var(--green6); border-radius:999px; padding:4px 10px; font-size:12px; }
    .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
    @media (max-width:640px){ .cols{ grid-template-columns:1fr; } }
    .colhead { font-size:16px; font-weight:700; margin:0 4px 8px; display:flex; align-items:center; gap:8px; }
    .colhead-green { color:var(--green); }
    .cnt { background:var(--stone100); color:var(--stone500); border-radius:999px;
           padding:2px 9px; font-size:13px; font-weight:600; }
    .colhead-green .cnt { background:#dcfce7; color:var(--green); }
    .emp { padding:10px 12px; border-top:1px solid var(--stone100); }
    .emp:first-child { border-top:none; }
    .emp .name { display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:500; }
    .edit-name { background:transparent; border:none; cursor:pointer; font-size:13px; padding:2px 4px; opacity:.5; }
    .edit-name:hover { opacity:1; }
    .emp .ctrls { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
    .emp .ctrls select { flex:1; min-width:88px; }
    .times { font-size:12px; color:var(--stone500); white-space:nowrap; }
    .daynote { font-size:12px; border-radius:8px; padding:1px 7px; white-space:nowrap; margin-inline-start:6px; }
    .dn-late { background:#fef3c7; color:#b45309; }
    .dn-early { background:#e0e7ff; color:#4338ca; }
    .dayedit { margin-top:8px; padding:8px; background:var(--stone100); border-radius:10px; display:flex; flex-direction:column; gap:8px; }
    .de-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .de-lbl { font-size:13px; font-weight:600; min-width:56px; }
    .de-row input { padding:5px 7px; border:1px solid var(--stone300,#d6d3d1); border-radius:8px; font-size:13px; }
    .de-foot { justify-content:space-between; }
    .viewtabs { display:flex; gap:8px; margin:14px 0 10px; }
    .vtab { flex:1; padding:9px; border:1px solid var(--stone300,#d6d3d1); background:#fff; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; color:var(--stone700,#44403c); }
    .vtab-on { background:var(--green,#16a34a); color:#fff; border-color:var(--green,#16a34a); }
    .mapCanvas { position:relative; width:100%; max-width:820px; margin:0 auto; border:1px solid var(--stone200,#e7e5e4); border-radius:12px; overflow:hidden; background:#fff; touch-action:none; }
    .mapCanvas img { display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; }
    .mk { position:absolute; transform:translate(-50%,-50%); background:rgba(255,255,255,.94); border:2px solid var(--green,#16a34a);
          border-radius:12px; padding:3px 9px; font-size:13px; font-weight:700; text-align:center; cursor:grab; white-space:nowrap;
          box-shadow:0 1px 4px rgba(0,0,0,.18); color:#14532d; line-height:1.15; }
    .mk .mk-n { display:block; font-size:16px; }
    .mk.mk-zero { border-color:var(--stone300,#d6d3d1); color:var(--stone500,#78716c); }
    .mk.mk-open { border-color:#b45309; box-shadow:0 0 0 3px #fde68a; }
    #mapPopup:not(:empty) { margin:10px auto 0; max-width:820px; background:#fff; border:1px solid var(--stone200,#e7e5e4); border-radius:12px; padding:12px; }
    .mp-h { font-weight:700; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
    .mp-name { display:inline-block; margin:3px 4px; padding:3px 9px; border-radius:999px; font-size:13px; background:#dcfce7; color:#15803d; }
    .mp-name.mp-abs { background:#f5f5f4; color:#78716c; }
    .muted { color:var(--stone500); font-size:13px; }
    .pill { border-radius:999px; padding:6px 10px; border:none; font-size:12px; font-weight:600; }
    .emp-x { background:transparent; color:#b91c1c; border:1px solid #fca5a5;
             border-radius:8px; padding:5px 9px; font-size:12px; font-weight:600; }
    .empty { padding:16px; color:var(--stone500); font-size:13px; text-align:center; }
    .hiddenbox { margin-top:24px; }
    .hiddenbox summary { cursor:pointer; font-weight:600; color:var(--stone500); padding:8px 4px; }
    .hidden-emp { display:flex; align-items:center; justify-content:space-between;
                  padding:10px 14px; border-top:1px solid var(--stone100); }
    .hidden-emp:first-child { border-top:none; }
    .btn-restore { background:var(--stone100); color:var(--green); border-radius:8px;
                   padding:5px 10px; font-size:12px; font-weight:600; }
    .s-present{background:#dcfce7;color:#15803d} .s-vacation{background:#fef3c7;color:#b45309}
    .s-sick{background:#ffe4e6;color:#be123c} .s-reserve{background:#e0f2fe;color:#0369a1}
    .s-absent{background:#f5f5f4;color:#78716c}
  </style>
</head>
<body>

<div id="gsLock">
  <div class="lock-logo">🕒</div>
  <div class="lock-title">נוכחות עובדים</div>
  <div class="lock-sub" id="gsLockSub">הנתונים פרטיים ונטענים רק לאחר התחברות עם חשבון גוגל מורשה.</div>
  <button class="gbtn" onclick="gsSignIn()">
    <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.4-4.6 7l7.1 5.5c4.2-3.9 6.6-9.6 6.6-16z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.7-2.9-.7-4.6s.3-3.2.7-4.6l-7.9-6.2C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.3 0 11.7-2.1 15.6-5.7l-7.1-5.5c-2 1.4-4.6 2.2-8.5 2.2-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>
    התחבר עם Google
  </button>
  <div class="lock-err" id="gsLockErr"></div>
</div>

<div class="wrap">
  <div class="head"><div class="bar"></div><h1>נוכחות עובדים</h1></div>
  <div class="sub" id="sub">מתעדכן מהשעון בתחילת כל יום</div>

  <div class="card">
    <div class="row">
      <div class="row" style="gap:8px">
        <input type="date" id="date" />
        <span class="muted" id="lastpull"></span>
      </div>
      <div class="row" style="gap:8px">
        <span class="muted" id="refAt"></span>
        <button class="btn-soft" id="delToggleBtn" onclick="delToggle()">🗑️ מחק כמה</button>
        <button class="btn-green" id="pull">רענן</button>
      </div>
    </div>
    <input type="search" id="search" class="search" placeholder="🔍 חיפוש עובד לפי שם…" />
  </div>

  <div class="hero">
    <div style="opacity:.85;font-size:14px">נוכחים היום</div>
    <div class="n"><span id="present">0</span> <small>מתוך <span id="total">0</span></small></div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="viewtabs">
    <button class="vtab vtab-on" id="tabList" onclick="setView('list')">📋 רשימה</button>
    <button class="vtab" id="tabMap" onclick="setView('map')">🗺️ מפה</button>
  </div>

  <div id="mapSection" style="display:none">
    <div class="muted" style="margin:0 2px 8px">גררי כל תווית מחלקה למקום שלה במפה (נשמר). לחיצה על תווית — מי במחלקה.</div>
    <div class="mapCanvas" id="mapCanvas"><img id="mapImg" alt="תוכנית המפעל"></div>
    <div id="mapPopup"></div>
    <div class="muted" id="mapUnassigned" style="margin-top:8px"></div>
  </div>

  <div class="cols">
    <div class="col">
      <div class="colhead colhead-green">נוכחים <span class="cnt" id="cntPresent">0</span></div>
      <div class="card" style="padding:0" id="listPresent"></div>
    </div>
    <div class="col">
      <div class="colhead">לא נוכחים <span class="cnt" id="cntAbsent">0</span></div>
      <div class="card" style="padding:0" id="listAbsent"></div>
    </div>
  </div>

  <details class="hiddenbox" id="hiddenbox">
    <summary>עובדים שהוסתרו (<span id="cntHidden">0</span>)</summary>
    <div class="card" style="padding:0;margin-top:8px" id="listHidden"></div>
  </details>
</div>

<div id="delBar">
  <button class="btn-del" onclick="commitDel()">🗑️ מחק נבחרים (<span id="delN">0</span>)</button>
  <button class="btn-soft" onclick="delToggle()">ביטול</button>
</div>

function gsShowErr(m){ const e=$("gsLockErr"); if(e) e.textContent=m||""; }
function today(){ const d=new Date(),p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }

function gsInitClient(){
  if(attClient) return attClient;
  if(!(window.google&&google.accounts&&google.accounts.oauth2)) return null;
  attClient=google.accounts.oauth2.initTokenClient({
    client_id:ATT_CLIENT_ID, scope:ATT_SCOPE,
    callback:(resp)=>{
      if(resp&&resp.error){ gsShowErr('ההתחברות נכשלה — נסה שוב'); return; }
      attToken=resp.access_token;
      try{ sessionStorage.setItem(ATT_TOKEN_KEY, JSON.stringify({t:attToken, exp:Date.now()+((resp.expires_in||3600)*1000)})); }catch(e){}
      gsAfterToken();
    }
  });
  return attClient;
}
function gsSignIn(){ gsShowErr(''); const c=gsInitClient();
  if(!c){ gsShowErr('מנגנון ההתחברות עדיין נטען — נסה שוב בעוד רגע'); return; }
  c.requestAccessToken({prompt: attToken?'':'consent'}); }

function gsAfterToken(){
  loadData().then(()=>{
    document.documentElement.classList.remove('locked');
    const l=$("gsLock"); if(l) l.style.display='none';
    if(!$("date").value) $("date").value=today();
    render(); stampRefresh();
    if(autoTimer) clearInterval(autoTimer);
    autoTimer=setInterval(silentRefresh, 90000);   // רענון שקט כל דקה וחצי
  }).catch(err=>{
    attToken=null; try{ sessionStorage.removeItem(ATT_TOKEN_KEY); }catch(e){}
    gsShowErr('אין הרשאה לגיליון עם החשבון הזה. התחבר עם החשבון המורשה.');
  });
}

// ---- קריאה/כתיבה לגיליון ----
async function sheetGet(tab){
  const range=encodeURIComponent(tab+'!A:E');
  const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+ATT_SHEET_ID+'/values/'+range,
    {headers:{Authorization:'Bearer '+attToken}});
  if(r.status===400) return [];   // לשונית עדיין לא קיימת — נחשב כריקה
  if(!r.ok) throw new Error('get '+tab+' '+r.status);
  const j=await r.json(); return j.values||[];
}
let _tabsChecked={};
async function ensureTab(tab){
  if(_tabsChecked[tab]) return;
  const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+ATT_SHEET_ID+'?fields=sheets.properties.title',
    {headers:{Authorization:'Bearer '+attToken}});
  if(r.ok){ const j=await r.json(); (j.sheets||[]).forEach(s=>_tabsChecked[s.properties.title]=1); }
  if(_tabsChecked[tab]) return;
  await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+ATT_SHEET_ID+':batchUpdate',
    {method:'POST',headers:{Authorization:'Bearer '+attToken,'Content-Type':'application/json'},
     body:JSON.stringify({requests:[{addSheet:{properties:{title:tab}}}]})});
  _tabsChecked[tab]=1;
}
async function sheetAppend(tab, rows){
  await ensureTab(tab);
  const range=encodeURIComponent(tab+'!A:E');
  const url='https://sheets.googleapis.com/v4/spreadsheets/'+ATT_SHEET_ID+'/values/'+range+
            ':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS';
  const r=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+attToken,'Content-Type':'application/json'},
    body:JSON.stringify({values:rows})});
  if(!r.ok) throw new Error('append '+tab+' '+r.status);
}

function dropHeader(rows, first){ return (rows.length && String(rows[0][0]||'').toLowerCase()===first) ? rows.slice(1) : rows; }

async function loadData(){
  const [rs, ps, ms, os, ns, mp] = await Promise.all([
    sheetGet(T_ROSTER), sheetGet(T_PUNCH), sheetGet(T_META), sheetGet(T_OVER), sheetGet(T_NOTES), sheetGet(T_MAP)
  ]);
  roster={}; punchesByDate={}; empMeta={}; overridesByDate={}; notesByDate={}; mapPos={}; lastPull="";
  dropHeader(rs,'uid').forEach(r=>{ if(r[0]) roster[r[0]]=r[1]||r[0]; });
  dropHeader(ps,'date').forEach(r=>{ const d=r[0],uid=r[1]; if(!d||!uid) return;
    (punchesByDate[d]=punchesByDate[d]||{})[uid]={first_in:r[2]||null,last_out:r[3]||null};
    if(d>lastPull) lastPull=d; });
  dropHeader(ms,'timestamp').forEach(r=>{ const uid=r[1]; if(!uid) return;   // last per uid wins
    empMeta[uid]={name:r[2]||'', dept:r[3]||'', active:(r[4]===''||r[4]==null)?1:Number(r[4])}; });
  dropHeader(os,'timestamp').forEach(r=>{ const d=r[1],uid=r[2]; if(!d||!uid) return;   // last per (date,uid)
    (overridesByDate[d]=overridesByDate[d]||{})[uid]=r[3]||'absent'; });
  // NOTES: [timestamp, date, uid, kind, val] — kind=late/early/clear; last-per-(date,uid,kind) גובר לפי סדר השורות
  dropHeader(ns,'timestamp').forEach(r=>{ const d=r[1],uid=r[2],kind=r[3],val=r[4]||''; if(!d||!uid||!kind) return;
    const o=((notesByDate[d]=notesByDate[d]||{})[uid]=notesByDate[d][uid]||{});
    if(kind==='clear'){ o.late=''; o.early=''; } else o[kind]=val; });
  // MAP_POS: [timestamp, dept, x, y] — מיקום תווית מחלקה במפה, אחרון-פר-מחלקה גובר
  dropHeader(mp,'timestamp').forEach(r=>{ const dept=r[1]; if(!dept) return;
    const x=Number(r[2]), y=Number(r[3]); if(!isNaN(x)&&!isNaN(y)) mapPos[dept]={x,y}; });
}

function buildState(date){
  const punch=punchesByDate[date]||{}, over=overridesByDate[date]||{}, notes=notesByDate[date]||{};
  const employees=[], hidden=[];
  Object.keys(roster).forEach(uid=>{
    const meta=empMeta[uid]||{};
    const active=(meta.active==null)?1:meta.active;
    const name=meta.name||roster[uid];
    const dept=meta.dept||"";
    if(!active){ hidden.push({uid,name,dept}); return; }
    const p=punch[uid];
    const nt=notes[uid]||{};
    const status=over[uid]||(p?"present":"absent");
    // "tracked" = עובד פעיל שבאמת קשור ליום: הוחתם בשעון, או שמיכל סימנה לו משהו
    // (חופש/מחלה/סטטוס/איחור/יציאה). עובדי-רשימה ישנים שלא מחתימים ואין להם סימון — לא מוצגים.
    const tracked=!!p || (over[uid]!=null) || !!(nt.late||nt.early);
    employees.push({uid,name,dept,status,note:nt,tracked,
      first_in:p?p.first_in:null, last_out:p?p.last_out:null});
  });
  employees.sort((a,b)=>a.name.localeCompare(b.name,"he"));
  hidden.sort((a,b)=>a.name.localeCompare(b.name,"he"));
  return {employees,hidden};
}

// ---- עריכות (עדכון מקומי מיידי + כתיבה לגיליון) ----
function nowTs(){ return new Date().toISOString().slice(0,19).replace("T"," "); }
async function writeMeta(uid){
  const m=empMeta[uid]||{name:roster[uid]||'',dept:'',active:1};
  try{ await sheetAppend(T_META, [[nowTs(), uid, m.name||roster[uid]||'', m.dept||'', String(m.active==null?1:m.active)]]); }
  catch(e){ alert("השמירה נכשלה: "+e.message); }
}
function setDept(uid,dept){ const m=empMeta[uid]||{name:roster[uid]||'',active:1}; m.dept=dept; m.active=(m.active==null?1:m.active); empMeta[uid]=m; render(); writeMeta(uid); }
function setActive(uid,active){ const m=empMeta[uid]||{name:roster[uid]||'',dept:''}; m.active=active?1:0; empMeta[uid]=m; render(); writeMeta(uid); }
function hideEmp(uid){
  const name=(empMeta[uid]&&empMeta[uid].name)||roster[uid]||"";
  if(confirm(`לסמן ש"${name}" לא עובד יותר?\n\nהעובד ייעלם מהלוח ולא יימשך יותר מהשעון.\nאפשר להחזיר אותו בכל עת מהרשימה "עובדים שהוסתרו".`))
    setActive(uid,0);
}
function editName(uid){
  const cur=(empMeta[uid]&&empMeta[uid].name)||roster[uid]||"";
  const v=prompt("שם העובד:", cur);
  if(v===null) return;
  const m=empMeta[uid]||{dept:'',active:1};
  m.name=v.trim(); m.active=(m.active==null?1:m.active); empMeta[uid]=m;
  render(); writeMeta(uid);
}
function delToggle(){ delMode=!delMode; delSel.clear(); render(); }
function toggleDel(uid,on){ if(on) delSel.add(uid); else delSel.delete(uid);
  const n=document.getElementById("delN"); if(n) n.textContent=delSel.size; }
async function commitDel(){
  if(!delSel.size){ delToggle(); return; }
  const ts=nowTs(), rows=[];
  delSel.forEach(uid=>{
    const m=empMeta[uid]||{dept:'',active:1}; m.name=m.name||roster[uid]||''; m.active=0; empMeta[uid]=m;
    rows.push([ts, uid, m.name, m.dept||'', '0']);
  });
  delMode=false; delSel.clear(); render();
  try{ await sheetAppend(T_META, rows); }catch(e){ alert("השמירה נכשלה: "+e.message); }
}
async function setStatus(uid,status){
  const d=$("date").value||today();
  (overridesByDate[d]=overridesByDate[d]||{})[uid]=status; render();
  try{ await sheetAppend(T_OVER, [[nowTs(), d, uid, status]]); }
  catch(e){ alert("השמירה נכשלה: "+e.message); }
}

// ---- עורך היום: חופש (טווח) + הודעת איחור / יציאה מוקדמת ----
function openDay(uid){ dayEdit=(dayEdit===uid)?null:uid; render(); }
function datesBetween(from,to){   // רשימת תאריכי YYYY-MM-DD כולל, מוגבל ל-60 יום
  const out=[]; const a=new Date(from+"T00:00:00"), b=new Date((to||from)+"T00:00:00");
  if(isNaN(a)||isNaN(b)||b<a) return [from];
  const p=n=>String(n).padStart(2,"0");
  for(let d=new Date(a), i=0; d<=b && i<60; d.setDate(d.getDate()+1), i++)
    out.push(d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()));
  return out;
}
async function saveVacation(uid){
  const f=$("vacFrom_"+uid)?.value, t=$("vacTo_"+uid)?.value;
  if(!f){ alert("בחרי תאריך התחלה לחופש"); return; }
  const days=datesBetween(f,t||f), ts=nowTs(), rows=[];
  days.forEach(d=>{ (overridesByDate[d]=overridesByDate[d]||{})[uid]="vacation"; rows.push([ts,d,uid,"vacation"]); });
  dayEdit=null; render();
  try{ await sheetAppend(T_OVER, rows); }catch(e){ alert("השמירה נכשלה: "+e.message); }
}
async function saveNote(uid,kind){   // kind = late / early
  const d=$("noteDate_"+uid)?.value||today();
  const tm=$("noteTime_"+uid)?.value;
  if(!tm){ alert("בחרי שעה"); return; }
  const o=((notesByDate[d]=notesByDate[d]||{})[uid]=notesByDate[d][uid]||{}); o[kind]=tm;
  dayEdit=null; render();
  try{ await sheetAppend(T_NOTES, [[nowTs(), d, uid, kind, tm]]); }
  catch(e){ alert("השמירה נכשלה: "+e.message); }
}
async function clearDay(uid){        // מנקה איחור/יציאה מוקדמת ליום המוצג
  const d=$("noteDate_"+uid)?.value||today();
  (notesByDate[d]=notesByDate[d]||{})[uid]={};
  dayEdit=null; render();
  try{ await sheetAppend(T_NOTES, [[nowTs(), d, uid, "clear", ""]]); }
  catch(e){ alert("השמירה נכשלה: "+e.message); }
}
function stampRefresh(){ const d=new Date(),p=n=>String(n).padStart(2,"0");
  const el=$("refAt"); if(el) el.textContent="עודכן "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds()); }

async function refresh(){ $("pull").textContent="מרענן…"; $("pull").disabled=true;
  try{ await loadData(); }catch(e){ alert("הרענון נכשל: "+e.message); }
  $("pull").textContent="רענן"; $("pull").disabled=false; render(); stampRefresh(); }

// רענון שקט אוטומטי — כדי שעובדים שמחתימים כרטיס יופיעו לבד, בלי ללחוץ.
// מדלג בזמן מצב מחיקה (כדי לא לאבד סימונים) ואם אין אסימון.
let autoTimer=null;
async function silentRefresh(){
  if(delMode || !attToken) return;
  try{ await loadData(); render(); stampRefresh(); }catch(e){}
}

// ---- תצוגה ----
function empRow(e, depts){
  if(delMode){
    return `<div class="emp emp-del"><label class="name">
      <input type="checkbox" class="delchk" onchange="toggleDel('${e.uid}',this.checked)" ${delSel.has(e.uid)?"checked":""}>
      <span>${e.name}</span></label></div>`;
  }
  const st=STATUS[e.status];
  const n=e.note||{};
  const t=[
    e.status==="present"&&(e.first_in||e.last_out)?`<span class="times">${e.first_in||"—"} ← ${e.last_out||"—"}</span>`:"",
    n.late?`<span class="daynote dn-late">⏰ מגיע ${n.late}</span>`:"",
    n.early?`<span class="daynote dn-early">🚪 יוצא ${n.early}</span>`:""
  ].join("");
  const dsel=`<select onchange="setDept('${e.uid}',this.value)">
      <option value="">ללא מחלקה</option>
      ${depts.map(d=>`<option ${d===e.dept?"selected":""}>${d}</option>`).join("")}</select>`;
  const ssel=`<select class="pill ${st.c}" onchange="setStatus('${e.uid}',this.value)">
      ${ORDER.map(s=>`<option value="${s}" ${s===e.status?"selected":""}>${STATUS[s].l}</option>`).join("")}</select>`;
  return `<div class="emp"><div class="name"><span>${e.name}
      <button class="edit-name" onclick="editName('${e.uid}')" title="ערוך שם">✏️</button>
      <button class="edit-name" onclick="openDay('${e.uid}')" title="חופש / איחור / יציאה מוקדמת">📅</button></span>${t}</div>
      <div class="ctrls">${dsel}${ssel}</div>${dayEdit===e.uid?dayPanel(e):""}</div>`;
}
function dayPanel(e){
  const d=$("date").value||today();
  return `<div class="dayedit">
    <div class="de-row"><span class="de-lbl">🌴 חופש:</span>
      <input type="date" id="vacFrom_${e.uid}" value="${d}"><span>עד</span>
      <input type="date" id="vacTo_${e.uid}" value="${d}">
      <button class="btn-soft" onclick="saveVacation('${e.uid}')">שמור חופש</button></div>
    <div class="de-row"><span class="de-lbl">⏰ ליום:</span>
      <input type="date" id="noteDate_${e.uid}" value="${d}">
      <input type="time" id="noteTime_${e.uid}">
      <button class="btn-soft" onclick="saveNote('${e.uid}','late')">מגיע מאוחר</button>
      <button class="btn-soft" onclick="saveNote('${e.uid}','early')">יוצא מוקדם</button></div>
    <div class="de-row de-foot">
      <button class="btn-soft" onclick="clearDay('${e.uid}')">נקה איחור/יציאה ליום המוצג</button>
      <button class="btn-soft" onclick="openDay('${e.uid}')">סגור</button></div>
  </div>`;
}

function render(){
  const d=$("date").value||today();
  const st=buildState(d);
  $("sub").textContent = Object.keys(roster).length
    ? "מתעדכן מהשעון בתחילת כל יום"
    : "ממתין לנתונים הראשונים מהשעון (מחשב המפעל) — יופיעו כאן אוטומטית";
  const depts=DEPARTMENTS.slice(); // 9 המחלקות הקבועות + כל מחלקה שכבר שויכה וטרם ברשימה
  Object.values(empMeta).forEach(m=>{ if(m.dept&&!depts.includes(m.dept)) depts.push(m.dept); });

  const f=filter.trim();
  const match=e=>(e.name||"").includes(f);
  const emps=st.employees;
  // ללא חיפוש: מציגים רק "מועסקים" — מי שהוחתם בשעון או שמיכל סימנה לו משהו ליום.
  // עם חיפוש: מציגים כל התאמה (כדי שאפשר יהיה למצוא כל עובד ולתת לו חופש/מחלקה).
  const pool = f ? emps.filter(match) : emps.filter(e=>e.tracked);
  const present=pool.filter(e=>e.status==="present");
  const absent=pool.filter(e=>e.status!=="present");

  $("present").textContent=present.length;
  $("total").textContent=pool.length;
  $("lastpull").textContent = lastPull ? ("עודכן מהשעון: "+lastPull) : "טרם נמשך מהשעון";

  const counts={}; ORDER.forEach(s=>counts[s]=0);
  pool.forEach(e=>counts[e.status]=(counts[e.status]||0)+1);
  $("chips").innerHTML=ORDER.filter(s=>s!=="present"&&counts[s])
    .map(s=>`<span class="chip">${STATUS[s].l}: ${counts[s]}</span>`).join("");

  $("cntPresent").textContent=present.length;
  $("cntAbsent").textContent=absent.length;
  $("listPresent").innerHTML=present.length?present.map(e=>empRow(e,depts)).join("")
    :`<div class="empty">${f?"אין נוכחים בסינון הזה":"אין נוכחים עדיין היום"}</div>`;
  $("listAbsent").innerHTML=absent.length?absent.map(e=>empRow(e,depts)).join("")
    :`<div class="empty">${f?"אין תוצאות בסינון הזה":"אין היעדרויות מסומנות ליום זה"}</div>`;

  const hf=st.hidden.filter(match);
  $("cntHidden").textContent=st.hidden.length;
  $("listHidden").innerHTML=hf.length
    ?hf.map(e=>`<div class="hidden-emp"><span>${e.name}</span>
        <button class="btn-restore" onclick="setActive('${e.uid}',1)">↩ החזר</button></div>`).join("")
    :`<div class="empty">אין עובדים מוסתרים</div>`;

  $("delBar").style.display = delMode ? "flex" : "none";
  $("delN").textContent = delSel.size;
  $("delToggleBtn").textContent = delMode ? "✖️ יציאה" : "🗑️ מחק כמה";
  $("delToggleBtn").style.background = delMode ? "#fee2e2" : "";

  // מעבר רשימה/מפה
  const mapOn = view==="map";
  document.querySelector(".cols").style.display = mapOn ? "none" : "";
  $("hiddenbox").style.display = mapOn ? "none" : "";
  $("mapSection").style.display = mapOn ? "block" : "none";
  $("tabList").classList.toggle("vtab-on", !mapOn);
  $("tabMap").classList.toggle("vtab-on", mapOn);
  if(mapOn) renderMap();
}

function setView(v){ view=v; mapOpenDept=null; render(); }
function closeDept(){ mapOpenDept=null; render(); }

function renderMap(){
  const img=$("mapImg"); if(img && !img.getAttribute("src")) img.src=window.PLAN_BG;
  const d=$("date").value||today();
  const st=buildState(d);
  const byDept={};
  st.employees.forEach(e=>{ if(!e.dept) return; (byDept[e.dept]=byDept[e.dept]||[]).push(e); });

  const canvas=$("mapCanvas");
  canvas.querySelectorAll(".mk").forEach(n=>n.remove());   // משאיר את ה-img, מוחק תוויות ישנות
  const depts=DEPARTMENTS.slice();
  Object.keys(byDept).forEach(dp=>{ if(!depts.includes(dp)) depts.push(dp); });
  depts.forEach(dp=>{
    const list=byDept[dp]||[];
    const present=list.filter(e=>e.status==="present").length;
    const pos=mapPos[dp]||DEPT_POS[dp]||{x:50,y:50};
    const mk=document.createElement("div");
    mk.className="mk"+(present?"":" mk-zero")+(mapOpenDept===dp?" mk-open":"");
    mk.style.left=pos.x+"%"; mk.style.top=pos.y+"%";
    mk.dataset.dept=dp; mk.dataset.x=pos.x; mk.dataset.y=pos.y;
    mk.innerHTML=dp+'<span class="mk-n">'+present+'</span>';
    canvas.appendChild(mk);
  });
  attachMarkerDrag();

  const pop=$("mapPopup");
  if(mapOpenDept){
    const list=(byDept[mapOpenDept]||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,"he"));
    const present=list.filter(e=>e.status==="present");
    const others=list.filter(e=>e.status!=="present" && e.tracked);
    pop.innerHTML=`<div class="mp-h"><span>${mapOpenDept} — ${present.length} נוכחים</span>
        <button class="btn-soft" onclick="closeDept()">סגור</button></div>
      ${present.map(e=>`<span class="mp-name">${e.name}${e.note&&e.note.early?" 🚪"+e.note.early:""}</span>`).join("")||'<span class="muted">אין נוכחים כרגע</span>'}
      ${others.length?'<div style="margin-top:8px" class="muted">מסומנים:</div>'+others.map(e=>`<span class="mp-name mp-abs">${e.name} · ${STATUS[e.status].l}${e.note&&e.note.late?" ⏰"+e.note.late:""}</span>`).join(""):""}`;
  } else pop.innerHTML="";

  const unassigned=st.employees.filter(e=>!e.dept && e.tracked);
  $("mapUnassigned").textContent = unassigned.length
    ? `לא משויכים למחלקה (מבין הנוכחים/מסומנים היום): ${unassigned.length}. חפשי אותם ברשימה ושייכי להם מחלקה.` : "";
}

async function saveMapPos(dept,x,y){
  mapPos[dept]={x,y};
  try{ await sheetAppend(T_MAP, [[nowTs(), dept, x.toFixed(1), y.toFixed(1)]]); }
  catch(e){ /* שמירת מיקום נכשלה — לא קריטי */ }
}

function attachMarkerDrag(){
  const wrap=$("mapCanvas");
  wrap.querySelectorAll(".mk").forEach(mk=>{
    let dragging=false, moved=false, sx=0, sy=0, rect=null;
    mk.addEventListener("pointerdown", ev=>{
      ev.preventDefault(); dragging=true; moved=false;
      rect=wrap.getBoundingClientRect(); sx=ev.clientX; sy=ev.clientY;
      try{ mk.setPointerCapture(ev.pointerId); }catch(e){}
    });
    mk.addEventListener("pointermove", ev=>{
      if(!dragging) return;
      if(Math.abs(ev.clientX-sx)>3 || Math.abs(ev.clientY-sy)>3) moved=true;
      let x=(ev.clientX-rect.left)/rect.width*100, y=(ev.clientY-rect.top)/rect.height*100;
      x=Math.max(1,Math.min(99,x)); y=Math.max(1,Math.min(99,y));
      mk.style.left=x+"%"; mk.style.top=y+"%"; mk.dataset.x=x; mk.dataset.y=y;
    });
    mk.addEventListener("pointerup", ev=>{
      if(!dragging) return; dragging=false;
      const dept=mk.dataset.dept;
      if(moved) saveMapPos(dept, Number(mk.dataset.x), Number(mk.dataset.y));
      else { mapOpenDept = (mapOpenDept===dept)?null:dept; render(); }
    });
  });
}

$("date").addEventListener("change", render);
$("pull").addEventListener("click", refresh);
$("search").addEventListener("input", e=>{ filter=e.target.value; render(); });

// בטעינה: אם יש אסימון תקף בסשן — להמשיך; אחרת מסך התחברות
window.addEventListener('load', ()=>{
  let tok=null; try{ tok=JSON.parse(sessionStorage.getItem(ATT_TOKEN_KEY)||'null'); }catch(e){}
  if(tok&&tok.t&&tok.exp&&tok.exp>Date.now()+60000){ attToken=tok.t; gsAfterToken(); return; }
  let tries=0; const iv=setInterval(()=>{ if(gsInitClient()||++tries>40) clearInterval(iv); }, 150);
});
</script>
